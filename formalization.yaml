fidelity:
  divergences: >-
    The strict cutoff, Borel hypothesis, dimension range, and self-pin
    conclusion are retained. Hausdorff dimension is Mathlib dimH. Packing
    dimension is defined by the bounded countable-cover characterization
    using upper box dimension and dyadic polynomial covering bounds. The
    equivalence with a separately defined packing-measure dimension is not
    formalized. The formal conclusion uses Lebesgue outer measure of the
    distance set; Borel E has an analytic, Lebesgue-measurable distance image,
    but that separate image-measurability fact is not part of the compared
    theorem. Literature estimates are proved within the Lean development
    rather than assumed as additional axioms. No novelty or optimality claim
    is made by the registration metadata.


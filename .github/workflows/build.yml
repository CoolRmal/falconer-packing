name: Lean build and Palomar preflight

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Your relationship to the substantive formalization
        required: true
        type: choice
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-hygiene:
    name: Check submission source
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the verification request identifier
        id: request
        env:
          REQUEST_KEY: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          request_id = hashlib.sha256(os.environ["REQUEST_KEY"].encode()).hexdigest()[:12]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"request_id={request_id}\n")
          PY

      - name: Check Palomar source and configuration requirements
        run: python3 scripts/check_submission.py

      - name: Reject proof holes and additional axioms
        shell: bash
        run: |
          python3 - <<'CHECK'
          import pathlib
          import re
          import subprocess

          forbidden = re.compile(
              r"\b(?:admit|native_decide)\b|Lean\.ofReduceBool|^\s*axiom\b",
              re.MULTILINE,
          )
          holes = re.compile(r"\bsorry\b")
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          problems = []
          for filename in files:
              if not filename.endswith(".lean"):
                  continue
              path = pathlib.Path(filename)
              if ".lake" in path.parts:
                  continue
              source = path.read_text()
              if forbidden.search(source):
                  problems.append(f"{filename}: additional axiom or unchecked proof method")
              # The independent Challenge has one deliberate statement hole.
              if filename != "Challenge.lean" and holes.search(source):
                  problems.append(f"{filename}: unresolved proof hole")
          if problems:
              raise SystemExit("\n".join(problems))
          CHECK

  build:
    name: Build the Lean project
    if: github.event_name != 'workflow_dispatch'
    needs: source-hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Lean and restore the Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build the project and independent statement
        run: lake build FalconerPacking Challenge Solution

  mechanical:
    name: Full Palomar verification
    if: github.event_name == 'workflow_dispatch'
    needs: source-hygiene
    # This includes clean dependency builds, the Challenge import audit,
    # lake comparator, Lean's kernel, NanoDa, and con-ron. The uploaded
    # mechanical report is advisory; submission and registration are separate.
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.source-hygiene.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ format('{{"comparator_config_path":"comparator.json","authorization_relationship":{0}}}', toJSON(inputs.authorization_relationship)) }}
